<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslimbek QR Code Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Code Generator</h1>
            <p class="subtitle">Muslimbek tomonidan yaratilgan</p>
        </header>

        <div class="main-content">
            <div class="input-section">
                <div class="card">
                    <h2>Ma'lumot Kiriting</h2>
                    <div class="form-group">
                        <label for="qr-input">Link yoki Matn</label>
                        <textarea id="qr-input" placeholder="https://example.com yoki matn kiriting..."></textarea>
                    </div>
                    <button id="generate-btn" class="btn primary">QR Kod Yaratish</button>
                </div>

                <div class="card customization-panel" id="customization-panel" style="display: none;">
                    <h2>Dizayn Sozlamalari</h2>
                    
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="colors">Ranglar</button>
                        <button class="tab-btn" data-tab="logo">Logo/Rasm</button>
                        <button class="tab-btn" data-tab="shape">Shakl</button>
                        <button class="tab-btn" data-tab="advanced">Qo'shimcha</button>
                    </div>

                    <div class="tab-content active" id="colors-tab">
                        <div class="form-group">
                            <label>QR Kod Rangi</label>
                            <div class="color-inputs">
                                <input type="color" id="fg-color" value="#000000">
                                <input type="text" id="fg-color-text" value="#000000">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Fon Rangi</label>
                            <div class="color-inputs">
                                <input type="color" id="bg-color" value="#ffffff">
                                <input type="text" id="bg-color-text" value="#ffffff">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Gradient</label>
                            <label class="toggle">
                                <input type="checkbox" id="enable-gradient">
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="form-group gradient-options" id="gradient-options" style="display: none;">
                            <label>Boshlang'ich Rang</label>
                            <div class="color-inputs">
                                <input type="color" id="gradient-start" value="#667eea">
                                <input type="text" id="gradient-start-text" value="#667eea">
                            </div>
                            <label>Tugash Rangi</label>
                            <div class="color-inputs">
                                <input type="color" id="gradient-end" value="#764ba2">
                                <input type="text" id="gradient-end-text" value="#764ba2">
                            </div>
                            <label>Gradient Yo'nalishi</label>
                            <select id="gradient-direction">
                                <option value="horizontal">Gorizontal</option>
                                <option value="vertical">Vertikal</option>
                                <option value="diagonal">Diagonal</option>
                                <option value="radial">Radial</option>
                            </select>
                        </div>
                    </div>

                    <div class="tab-content" id="logo-tab">
                        <div class="form-group">
                            <label>QR Kod Ichiga Rasm/Logo Qo'shish</label>
                            <div class="logo-upload">
                                <input type="file" id="logo-upload" accept="image/*" hidden>
                                <button id="logo-btn" class="btn secondary">Rasm Tanlash</button>
                                <span id="logo-name">Fayl tanlanmagan</span>
                            </div>
                            <div class="logo-preview" id="logo-preview" style="display: none;">
                                <img id="logo-img" src="" alt="Logo preview">
                                <button id="remove-logo" class="btn danger small">O'chirish</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Logo O'lchami (%)</label>
                            <input type="range" id="logo-size" min="10" max="30" value="20">
                            <span id="logo-size-value">20%</span>
                        </div>
                        <div class="form-group">
                            <label>Logo Chegarasi</label>
                            <label class="toggle">
                                <input type="checkbox" id="logo-border" checked>
                                <span class="slider"></span>
                            </label>
                        </div>
                        <div class="form-group logo-border-options" id="logo-border-options">
                            <label>Chegara Rangi</label>
                            <div class="color-inputs">
                                <input type="color" id="logo-border-color" value="#ffffff">
                                <input type="text" id="logo-border-color-text" value="#ffffff">
                            </div>
                            <label>Chegara Qalini</label>
                            <input type="range" id="logo-border-width" min="0" max="10" value="4">
                            <span id="logo-border-width-value">4px</span>
                        </div>
                    </div>

                    <div class="tab-content" id="shape-tab">
                        <div class="form-group">
                            <label>Modul Shakli</label>
                            <div class="shape-options">
                                <button class="shape-btn active" data-shape="square" title="Kvadrat">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>
                                </button>
                                <button class="shape-btn" data-shape="dots" title="Nuqta">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>
                                </button>
                                <button class="shape-btn" data-shape="rounded" title="Yumaloq Burchak">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
                                </button>
                                <button class="shape-btn" data-shape="circle" title="Dumaloq">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
                                </button>
                                <button class="shape-btn" data-shape="diamond" title="Almazo">
                                    <svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Gozalak Shakli (Finder Pattern)</label>
                            <div class="shape-options">
                                <button class="shape-btn active" data-eye="square" title="Kvadrat">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><rect x="7" y="7" width="10" height="10"/></svg>
                                </button>
                                <button class="shape-btn" data-eye="rounded" title="Yumaloq">
                                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
                                </button>
                                <button class="shape-btn" data-eye="circle" title="Dumaloq">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>
                                </button>
                                <button class="shape-btn" data-eye="dot" title="Nuqta">
                                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content" id="advanced-tab">
                        <div class="form-group">
                            <label>QR Kod O'lchami</label>
                            <input type="range" id="qr-size" min="128" max="512" value="256" step="32">
                            <span id="qr-size-value">256px</span>
                        </div>
                        <div class="form-group">
                            <label>Chegara (Margin)</label>
                            <input type="range" id="qr-margin" min="0" max="20" value="4">
                            <span id="qr-margin-value">4</span>
                        </div>
                        <div class="form-group">
                            <label>Xato Bartaraf Etish Darajasi</label>
                            <select id="error-correction">
                                <option value="L">L - Past (7%)</option>
                                <option value="M" selected>M - O'rta (15%)</option>
                                <option value="Q">Q - Yuqori (25%)</option>
                                <option value="H">H - Eng Yuqori (30%)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fon Shaffofligi</label>
                            <label class="toggle">
                                <input type="checkbox" id="transparent-bg">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <button id="apply-design" class="btn primary">Dizaynni Qo'llash</button>
                </div>
            </div>

            <div class="output-section">
                <div class="card">
                    <h2>Natija</h2>
                    <div class="qr-container" id="qr-container">
                        <div class="placeholder">
                            <svg viewBox="0 0 64 64" class="placeholder-icon">
                                <rect x="8" y="8" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="24" y="8" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="40" y="8" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="8" y="24" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="40" y="24" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="8" y="40" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="24" y="40" width="12" height="12" rx="1" fill="currentColor"/>
                                <rect x="40" y="40" width="12" height="12" rx="1" fill="currentColor"/>
                            </svg>
                            <p>QR kod uchun ma'lumot kiriting</p>
                        </div>
                    </div>
                    <div class="actions" id="actions" style="display: none;">
                        <button id="download-png" class="btn primary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            PNG Yuklab Olish
                        </button>
                        <button id="download-svg" class="btn secondary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            SVG Yuklab Olish
                        </button>
                        <button id="copy-btn" class="btn secondary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Nusxalash
                        </button>
                    </div>
                </div>

                <div class="card presets">
                    <h2>Tayyor Shablonlar</h2>
                    <div class="preset-grid" id="preset-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
